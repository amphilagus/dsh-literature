# dsh-literature bundle patch: insert literature-search (plugin-level
# enabled: false) and schedule (loader-level disabled: true). The
# 文献跟踪助理 preset remounts both as active rows.
#
# Schedule has no config.enabled: host must use `disabled: true` so Loader
# never calls apply(). A preset row without `disabled` is a different entry
# and does apply.
#
# Per-user overrides belong in the profile's own cordis.patch.yml, addressed
# by id:
#   - id: literature-search
#     config:
#       mailto: you@example.com
#       dbPath: /custom/literature.db
#       cacheRemote: true
- insert:
    - id: literature-search
      name: '@amphilagus/dsh-literature'
      config:
        enabled: false
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
      disabled: true
