# dsh-literature bundle patch: insert the scientific-literature search plugin
# and schedule. Both stay off on the host; the 文献跟踪助理 preset remounts
# them with enabled: true.
#
# Per-user overrides belong in the profile's own cordis.patch.yml, addressed
# by id:
#   - id: literature-search
#     config:
#       mailto: you@example.com
#       dbPath: /custom/literature.db
#       cacheRemote: true
- insert:
    - id: literature-search
      name: '@amphilagus/dsh-literature'
      config:
        enabled: false
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
      config:
        enabled: false
